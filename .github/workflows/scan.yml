name: 观察池日报

on:
  schedule:
    # UTC 22:15，周一至周五 = 北京时间周二至周六 06:15（美股收盘后，夏令时/冬令时都适用）
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchlist-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: 安装依赖
        run: pip install -r scanner/requirements.txt

      - name: 扫描并发送邮件
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scanner/scan.py

      - name: 提交 scan.md
        if: ${{ !cancelled() && hashFiles('scan.md') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan.md
          if git diff --cached --quiet; then
            echo "scan.md 无变化，跳过提交"
            exit 0
          fi
          git commit -m "观察池日报 $(head -n1 scan.md | sed 's/^# 观察池日报 //')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
