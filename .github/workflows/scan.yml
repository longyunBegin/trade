name: 观察池日报

on:
  # 定时改由 Grok Bot「观察池日报」例程触发（北京时间周二至周六 09:45），不再用 GitHub cron
  workflow_dispatch:
    inputs:
      force:
        description: "强制发送（忽略“休市/无新数据/今天已发过”的检查）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watchlist-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: 安装依赖
        run: pip install -r scanner/requirements.txt

      - name: 扫描（不发信）
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: python scanner/scan.py --no-email  # 发信改由 Grok Bot 用 lyatomic@mail.grokbot.com

      - name: 提交 scan.md
        if: ${{ !cancelled() && hashFiles('scan.md') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan.md
          if git diff --cached --quiet; then
            echo "scan.md 无变化，跳过提交"
            exit 0
          fi
          git commit -m "观察池日报 $(head -n1 scan.md | sed 's/^# 观察池日报 //')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
